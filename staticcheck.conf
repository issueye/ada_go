# ada-go staticcheck 配置（开发计划 §7.1 / 设计 10 §11.2 的门禁命令就是 staticcheck ./...）。
#
# 文件名为 staticcheck.conf（无点前缀）：任务单里写的是 .staticcheck.conf，但实测
# staticcheck v0.8.x（2025.1）只读取无点的 staticcheck.conf——带点文件被静默忽略
# （A/B：同一份内容，带点时 ST1005 照报，去点后消失）。为让配置真实生效而改名，
# 其余口径不变；仍不引入 .golangci.yml（理由见下）。
#
# 为什么是 staticcheck 原生配置而不是 .golangci.yml：
#   文档冻结的门禁是且只是 staticcheck；本文件被 staticcheck 原生读取，
#   门禁命令与配置一一对应。golangci-lint 会再引入几十个未经 M0 决策的 linter 与
#   它自己的版本面（与 staticcheck 内置版本还可能漂移），对「契约冻结」阶段是多余负担；
#   CI 也只安装一个工具：honnef.co/go/tools/cmd/staticcheck（@latest，钉定版本由 M5 处理）。
#
# checks 口径（staticcheck v0.8.x / 2025.1，TOML 语法）：
#   default 已含 SA*/S*/Q*/U* 与多数风格检查（ST1005/ST1008/ST1012/ST1019 默认打开，
#   ST1000/ST1003/ST1016/ST1020~1023 默认关闭），这里按 M0「命名即契约、错误文案中文化」增量调整：
#     +ST1003  标准命名（ID/URL/JSON 等缩写词大小写）：proto DTO 与导出标识符是契约真源；
#     +ST1016  同类型方法接收器值/指针形式一致：ports 十二端口实现的风格基线；
#     -ST1005  错误串大小写/标点：09 §10 与 diag 的错误文案按设计是中文（句读、括注），
#              与 ST1005 的英文排版规则系统性冲突（实测 tools/genproto、tools/verify 多例），
#              关掉；错误文案质量由 adag verify、diag 码与测试把关。
#   保持 default 关闭、暂不打开的散文类风格检查：
#     ST1000/ST1020/ST1021/ST1022/ST1023 —— 英文包/文档注释句式约定；
#     仓库当前为中文契约注释（实测 internal/ports、internal/gateway 已有存量违例），
#     并入 M2「文档与 golden 基线」治理时再评估开启，避免 M0 期反复空转。
checks = [
	"default",
	"ST1003",
	"ST1016",
	"-ST1005",
]

# 测试代码同样受门禁约束（conformance/testkit 夹具的命名也是契约的一部分）。
tests = true

# 风格检查已在本文件显式决策，不再重复打印「哪些风格检查从未开启」的提示。
initial_style_warnings = false
